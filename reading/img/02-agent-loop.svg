<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The agent loop</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>

  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">The agent loop</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#6b7280">What happens every time you send Claude Code a message</text>

  <!-- Row 1 -->
  <rect x="40" y="140" width="200" height="90" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="140" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">1 · Build the context</text>
  <text x="140" y="198" text-anchor="middle" font-size="13" fill="#4b5563">rules (CLAUDE.md), files,</text>
  <text x="140" y="216" text-anchor="middle" font-size="13" fill="#4b5563">the chat so far</text>

  <line x1="242" y1="185" x2="296" y2="185" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="300" y="140" width="200" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">2 · Ask the model</text>
  <text x="400" y="198" text-anchor="middle" font-size="13" fill="#4b5563">it answers with text,</text>
  <text x="400" y="216" text-anchor="middle" font-size="13" fill="#4b5563">or asks for a tool</text>

  <line x1="502" y1="185" x2="536" y2="185" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <polygon points="630,125 720,185 630,245 540,185" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="630" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Wants a</text>
  <text x="630" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">tool?</text>

  <line x1="722" y1="185" x2="806" y2="185" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="764" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">no</text>

  <rect x="810" y="140" width="150" height="90" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="885" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Done</text>
  <text x="885" y="202" text-anchor="middle" font-size="13" fill="#4b5563">reply to you</text>

  <!-- Row 2 -->
  <line x1="630" y1="247" x2="630" y2="326" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="644" y="292" font-size="13" font-weight="700" fill="#6b7280">yes</text>

  <rect x="530" y="330" width="200" height="90" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="630" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">3 · Check permission</text>
  <text x="630" y="388" text-anchor="middle" font-size="13" fill="#4b5563">allowed? ask you?</text>
  <text x="630" y="406" text-anchor="middle" font-size="13" fill="#4b5563">blocked?</text>

  <line x1="528" y1="375" x2="504" y2="375" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="300" y="330" width="200" height="90" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="400" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">4 · Run the tool</text>
  <text x="400" y="388" text-anchor="middle" font-size="13" fill="#4b5563">read or edit a file,</text>
  <text x="400" y="406" text-anchor="middle" font-size="13" fill="#4b5563">run a command, search</text>

  <line x1="298" y1="375" x2="244" y2="375" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="40" y="330" width="200" height="90" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="140" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">5 · Add the result</text>
  <text x="140" y="388" text-anchor="middle" font-size="13" fill="#4b5563">the output goes back</text>
  <text x="140" y="406" text-anchor="middle" font-size="13" fill="#4b5563">into the context</text>

  <line x1="140" y1="328" x2="140" y2="234" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="152" y="286" font-size="13" font-weight="700" fill="#6b7280">repeat</text>

  <text x="500" y="478" text-anchor="middle" font-size="15" font-style="italic" fill="#374151">"The core of the system is a simple while-loop that calls the model, runs tools, and repeats."</text>
  <text x="500" y="502" text-anchor="middle" font-size="13" fill="#6b7280">Liu et al., 2026, abstract</text>
</svg>
