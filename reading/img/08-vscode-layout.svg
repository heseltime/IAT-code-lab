<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One window for everything: VS Code</title>
  <rect width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">One window for everything</text>
  <text x="500" y="66" text-anchor="middle" font-size="15" fill="#6b7280">Files, code, Git and the terminal (with Claude Code) side by side in VS Code</text>

  <!-- Window -->
  <rect x="40" y="88" width="920" height="470" rx="12" fill="#1f2937"/>
  <rect x="40" y="88" width="920" height="30" rx="12" fill="#374151"/>
  <rect x="40" y="106" width="920" height="12" fill="#374151"/>
  <circle cx="62" cy="103" r="6" fill="#ef4444"/>
  <circle cx="82" cy="103" r="6" fill="#f59e0b"/>
  <circle cx="102" cy="103" r="6" fill="#10b981"/>
  <text x="500" y="108" text-anchor="middle" font-size="13" fill="#d1d5db">IAT-ai-knowledgebase — Visual Studio Code</text>

  <!-- Activity bar -->
  <rect x="40" y="118" width="46" height="440" fill="#111827"/>
  <rect x="50" y="134" width="26" height="22" rx="4" fill="#4b5563"/>
  <rect x="50" y="172" width="26" height="22" rx="4" fill="#d97706"/>
  <rect x="50" y="210" width="26" height="22" rx="4" fill="#4b5563"/>
  <rect x="50" y="248" width="26" height="22" rx="4" fill="#4b5563"/>

  <!-- Side bar: Source Control -->
  <rect x="86" y="118" width="250" height="440" fill="#273244"/>
  <text x="100" y="144" font-size="12" font-weight="700" fill="#fbbf24">SOURCE CONTROL</text>
  <rect x="100" y="156" width="222" height="26" rx="4" fill="#111827" stroke="#4b5563"/>
  <text x="110" y="173" font-size="12" fill="#9ca3af">Message (commit text)</text>
  <rect x="100" y="190" width="222" height="26" rx="4" fill="#2563eb"/>
  <text x="211" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">✓ Commit</text>
  <text x="100" y="240" font-size="11" font-weight="700" fill="#9ca3af">STAGED CHANGES</text>
  <text x="112" y="260" font-size="12" fill="#e5e7eb">index.md</text>
  <text x="306" y="260" text-anchor="end" font-size="12" font-weight="700" fill="#fbbf24">M</text>
  <text x="100" y="288" font-size="11" font-weight="700" fill="#9ca3af">CHANGES</text>
  <text x="112" y="308" font-size="12" fill="#e5e7eb">gradient-descent.md</text>
  <text x="306" y="308" text-anchor="end" font-size="12" font-weight="700" fill="#fbbf24">M</text>
  <text x="112" y="328" font-size="12" fill="#e5e7eb">quiz-neurons.md</text>
  <text x="306" y="328" text-anchor="end" font-size="12" font-weight="700" fill="#34d399">U</text>
  <text x="100" y="356" font-size="11" font-weight="700" fill="#9ca3af">EXPLORER</text>
  <text x="112" y="376" font-size="12" fill="#e5e7eb">▸ raw/</text>
  <text x="112" y="396" font-size="12" fill="#e5e7eb">▾ wiki/</text>
  <text x="128" y="416" font-size="12" fill="#e5e7eb">index.md</text>
  <text x="128" y="436" font-size="12" fill="#e5e7eb">concepts/</text>

  <!-- Editor: diff view -->
  <rect x="336" y="118" width="624" height="250" fill="#1f2937"/>
  <rect x="336" y="118" width="624" height="28" fill="#111827"/>
  <text x="352" y="137" font-size="12" fill="#e5e7eb">gradient-descent.md (Working Tree)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <text x="352" y="172" fill="#9ca3af">12  The derivative tells you which way</text>
    <rect x="344" y="182" width="606" height="22" fill="#7f1d1d" opacity="0.6"/>
    <text x="352" y="198" fill="#fecaca">13 − is "downhill".</text>
    <rect x="344" y="206" width="606" height="22" fill="#14532d" opacity="0.7"/>
    <text x="352" y="222" fill="#bbf7d0">13 + is "downhill". The notebook calls it</text>
    <rect x="344" y="230" width="606" height="22" fill="#14532d" opacity="0.7"/>
    <text x="352" y="246" fill="#bbf7d0">14 + "the direction to the minimum".</text>
    <text x="352" y="276" fill="#9ca3af">15  For one parameter β₁, one step is:</text>
  </g>

  <!-- Terminal panel -->
  <rect x="336" y="368" width="624" height="190" fill="#0b1220"/>
  <rect x="336" y="368" width="624" height="26" fill="#111827"/>
  <text x="352" y="386" font-size="12" font-weight="700" fill="#e5e7eb">TERMINAL</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <text x="352" y="416" fill="#34d399">~/IAT-ai-knowledgebase (main) $</text>
    <text x="600" y="416" fill="#e5e7eb">claude</text>
    <text x="352" y="440" fill="#fbbf24">&gt;</text>
    <text x="368" y="440" fill="#e5e7eb">ingest raw/2026-11-20-physics-motion.md</text>
    <text x="352" y="464" fill="#9ca3af">● Read raw/2026-11-20-physics-motion.md</text>
    <text x="352" y="486" fill="#9ca3af">● Update wiki/concepts/gradient-descent.md</text>
    <text x="352" y="508" fill="#9ca3af">  Proposed commit: wiki(ingest): Physics: motion</text>
  </g>

  <!-- Callouts -->
  <g font-size="13">
    <rect x="40" y="566" width="300" height="26" rx="13" fill="#fffbeb" stroke="#d97706"/>
    <text x="190" y="584" text-anchor="middle" fill="#78350f"><tspan font-weight="700">Source Control:</tspan> stage, commit, push</text>
    <rect x="350" y="566" width="300" height="26" rx="13" fill="#eff6ff" stroke="#2563eb"/>
    <text x="500" y="584" text-anchor="middle" fill="#1e3a8a"><tspan font-weight="700">Diff view:</tspan> see every change in color</text>
    <rect x="660" y="566" width="300" height="26" rx="13" fill="#ecfdf5" stroke="#059669"/>
    <text x="810" y="584" text-anchor="middle" fill="#064e3b"><tspan font-weight="700">Terminal:</tspan> Claude Code runs right here</text>
  </g>
</svg>
