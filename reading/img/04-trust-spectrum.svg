<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How much should the agent do alone?</title>
  <defs>
    <linearGradient id="trust" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">How much should the agent do alone?</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Permission modes: a "graduated trust spectrum" (design principle 2)</text>

  <text x="60" y="118" font-size="14" font-weight="700" fill="#065f46">You check everything</text>
  <text x="940" y="118" text-anchor="end" font-size="14" font-weight="700" fill="#991b1b">The agent acts alone</text>
  <rect x="60" y="130" width="880" height="16" rx="8" fill="url(#trust)"/>

  <!-- markers -->
  <g font-size="13" text-anchor="middle">
    <circle cx="120" cy="138" r="9" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="120" y="180" font-weight="700" fill="#111827" font-family="Menlo, Consolas, monospace">plan</text>
    <text x="120" y="200" fill="#4b5563">only reads and</text>
    <text x="120" y="217" fill="#4b5563">makes a plan</text>

    <circle cx="300" cy="138" r="9" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="300" y="180" font-weight="700" fill="#111827" font-family="Menlo, Consolas, monospace">default</text>
    <text x="300" y="200" fill="#4b5563">asks you before</text>
    <text x="300" y="217" fill="#4b5563">risky actions</text>

    <circle cx="490" cy="138" r="9" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="490" y="180" font-weight="700" fill="#111827" font-family="Menlo, Consolas, monospace">acceptEdits</text>
    <text x="490" y="200" fill="#4b5563">edits files without</text>
    <text x="490" y="217" fill="#4b5563">asking</text>

    <circle cx="680" cy="138" r="9" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="680" y="180" font-weight="700" fill="#111827" font-family="Menlo, Consolas, monospace">auto</text>
    <text x="680" y="200" fill="#4b5563">an AI classifier</text>
    <text x="680" y="217" fill="#4b5563">decides for you</text>

    <circle cx="880" cy="138" r="9" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="880" y="180" font-weight="700" fill="#111827" font-family="Menlo, Consolas, monospace">bypass</text>
    <text x="880" y="200" fill="#4b5563">no checks: only in</text>
    <text x="880" y="217" fill="#4b5563">a throwaway sandbox</text>
  </g>

  <!-- Callouts -->
  <rect x="60" y="260" width="420" height="140" rx="14" fill="#fffbeb" stroke="#d97706"/>
  <text x="80" y="292" font-size="16" font-weight="700" fill="#78350f">The problem: approval fatigue</text>
  <text x="80" y="320" font-size="14" fill="#374151">People approve about 93% of permission</text>
  <text x="80" y="340" font-size="14" fill="#374151">questions. After many "yes" clicks, they</text>
  <text x="80" y="360" font-size="14" fill="#374151">stop reading them. Asking more often does</text>
  <text x="80" y="380" font-size="14" fill="#374151">not automatically make things safer.</text>

  <rect x="520" y="260" width="420" height="140" rx="14" fill="#ecfdf5" stroke="#059669"/>
  <text x="540" y="292" font-size="16" font-weight="700" fill="#064e3b">The answer: layers</text>
  <text x="540" y="320" font-size="14" fill="#374151">Deny rules beat ask rules beat allow rules.</text>
  <text x="540" y="340" font-size="14" fill="#374151">Read-only actions need less checking than</text>
  <text x="540" y="360" font-size="14" fill="#374151">ones you can't undo. A sandbox cut the</text>
  <text x="540" y="380" font-size="14" fill="#374151">number of questions by about 84%.</text>

  <text x="500" y="428" text-anchor="middle" font-size="12" fill="#6b7280">Liu et al., 2026, §5 and §12.3. The paper counts up to seven modes; five are shown here.</text>
</svg>
